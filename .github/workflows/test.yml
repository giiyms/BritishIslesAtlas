name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Includes src/zero-sample.test.ts: no layer may ship without real data and a licensed source.
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build
